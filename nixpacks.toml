[phases.setup]
nixPkgs = ['php81', 'php81Packages.composer', 'nodejs', 'apacheHttpd', 'git', 'curl', 'libpng']

[phases.install]
cmds = [
  'sudo apt-get update',
  'sudo apt-get install -y libapache2-mod-php php-mysql php-gd php-redis redis-tools wget',
  'composer install --no-dev --optimize-autoloader'
]

[phases.build]
cmds = [
  'npm install',
  'npm run production',
  'php artisan krayin-crm:install'
]

[start]
cmd = 'php artisan serve --host=0.0.0.0 --port=8090'
