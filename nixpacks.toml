[phases.setup]
nixPkgs = [
    'php82',
    'php82Packages.composer',
    'nodejs',
    'git',
    'curl',
    'libpng'
]
nixLibs = ['libmysqlclient']
nixOverlays = ['https://github.com/railwayapp/nix-npm-overlay/archive/main.tar.gz']
nixpkgsArchive = 'dbc4f15b899ac77a8d408d8e0f89fa9c0c5f2b78'

[phases.install]
dependsOn = ['setup']
cmds = [
    'sudo apt-get update',
    'sudo apt-get install -y default-libmysqlclient-dev mariadb-server redis-server php8.1-fpm php8.1-mysql php8.1-gd php8.1-redis php8.1-curl php8.1-xml php8.1-zip php8.1-mbstring php8.1-bcmath php8.1-intl',
    # Configuración inicial del entorno
    'mkdir -p /var/lib/mysql /run/mysqld /var/lib/redis',
    'chown -R mysql:mysql /var/lib/mysql /run/mysqld',
    # Iniciar MySQL/MariaDB con supervisión más cuidadosa
    'service mariadb start || true',
    'sleep 5',
    'systemctl start mariadb || true',
    'sleep 5',
    # Intentar iniciar el servidor de manera manual si los métodos anteriores fallan
    'mysqld --user=mysql --datadir=/var/lib/mysql --socket=/run/mysqld/mysqld.sock &',
    'sleep 15',
    # Iniciar Redis
    'redis-server --daemonize yes',
    'sleep 5',
    # Verificar que MySQL está funcionando
    'ps aux | grep mysql',
    'ls -la /run/mysqld/',
    # Crear la base de datos y usuario con mayor tolerancia a fallos
    'mysql -h 127.0.0.1 -u root -e "CREATE DATABASE IF NOT EXISTS krayin_db;"',
    'mysql -h 127.0.0.1 -u root -e "CREATE USER IF NOT EXISTS krayineu_user@localhost IDENTIFIED BY \"R3g3n3ri&\";"',
    'mysql -h 127.0.0.1 -u root -e "GRANT ALL PRIVILEGES ON krayin_db.* TO krayineu_user@localhost;"',
    'mysql -h 127.0.0.1 -u root -e "FLUSH PRIVILEGES;"',
    # Instalar dependencias
    'composer install --no-dev --optimize-autoloader'
]

[phases.build]
dependsOn = ['install']
cmds = [
    'npm install',
    'npm run build',
    'php artisan key:generate --force',
    'php artisan migrate --force',
    'php artisan config:cache',
    'php artisan route:cache',
    'php artisan view:cache'
]

[start]
cmd = '''
service mariadb start & 
redis-server --daemonize yes & 
sleep 10 && 
php artisan serve --host=0.0.0.0 --port=${PORT:-8090}
'''
