[phases.setup]
nixPkgs = [
    'php82',
    'php82Packages.composer',
    'nodejs',
    'apacheHttpd',
    'git',
    'curl',
    'libpng'
]
nixLibs = ['libmysqlclient']
nixOverlays = ['https://github.com/railwayapp/nix-npm-overlay/archive/main.tar.gz']
nixpkgsArchive = 'dbc4f15b899ac77a8d408d8e0f89fa9c0c5f2b78'

[phases.install]
dependsOn = ['setup']
cmds = [
    'sudo apt-get update',
    'sudo apt-get install -y mysql-server redis-server libapache2-mod-php php8.1-mysql php8.1-gd php8.1-redis apache2 redis-tools wget',
    'mysqld & sleep 5',  # Inicia MySQL en segundo plano y espera 5 segundos
    'redis-server --port 6379 --protected-mode no &',  # Inicia Redis en segundo plano
    # Asegura permisos para los directorios de datos
    'chmod -R 755 /var/lib/mysql',
    'chmod -R 755 /var/lib/redis',
    # Asegura permisos para el archivo de configuración de Redis
    'chmod 644 /etc/redis/redis.conf',
    # Configura y crea la base de datos MySQL
    '''mysql -u root -e "CREATE DATABASE krayin_db;" && mysql -u root -e "CREATE USER 'krayineu_user'@'localhost' IDENTIFIED BY 'R3g3n3ri&';" && mysql -u root -e "GRANT ALL PRIVILEGES ON krayin_db.* TO 'krayineu_user'@'localhost';" && mysql -u root -e "FLUSH PRIVILEGES;"''',
    '''sed -i "s/bind 127.0.0.1 ::1/bind 0.0.0.0/" /etc/redis/redis.conf''',
    'composer install --no-dev --optimize-autoloader'
]

[phases.build]
dependsOn = ['install']
cmds = [
    'npm install',
    'npm run build',  # Asegúrate de que este comando sea válido en package.json
    'php artisan krayin-crm:install'
]

[start]
cmd = 'mysqld & sleep 5 && redis-server --port 6379 --protected-mode no & sleep 5 && php artisan serve --host=0.0.0.0 --port=8090'
