[phases.setup]
nixPkgs = [
    'php82',
    'php82Packages.composer',
    'nodejs',
    'apacheHttpd',
    'git',
    'curl',
    'libpng'
]
nixLibs = ['libmysqlclient']
nixOverlays = ['https://github.com/railwayapp/nix-npm-overlay/archive/main.tar.gz']
nixpkgsArchive = 'dbc4f15b899ac77a8d408d8e0f89fa9c0c5f2b78'

[phases.install]
dependsOn = ['setup']
cmds = [
    'sudo apt-get update',
    'sudo apt-get install -y default-libmysqlclient-dev libapache2-mod-php php8.1 php8.1-mysql php8.1-gd php8.1-redis apache2 redis-tools wget',
    # Crea y ajusta permisos para directorios de datos
    'mkdir -p /var/lib/mysql /var/lib/redis',
    'chmod -R 755 /var/lib/mysql',
    'chmod -R 755 /var/lib/redis',
    # Descarga e instala MySQL y Redis manualmente (binarios mínimos)
    'wget https://dev.mysql.com/get/downloads/mysql-8.0/mysql-server_8.0.41-1ubuntu22.04_amd64.deb -O /tmp/mysql-server.deb',
    'wget https://packages.redis.io/redis/redis-7.2.4-1.el9.x86_64.rpm -O /tmp/redis-server.rpm',
    'dpkg -i /tmp/mysql-server.deb || apt-get install -f -y',
    'rpm2cpio /tmp/redis-server.rpm | cpio -idmv',
    'mv /usr/bin/redis* /usr/local/bin/',
    # Inicia MySQL en segundo plano y espera 5 segundos para que esté listo
    'mysqld --user=mysql --datadir=/var/lib/mysql & sleep 5',
    # Inicia Redis en segundo plano, ajusta configuración y permisos
    'redis-server --port 6379 --protected-mode no --dir /var/lib/redis & sleep 5',
    # Configura y crea la base de datos MySQL
    '''mysql -u root -e "CREATE DATABASE IF NOT EXISTS krayin_db;" && mysql -u root -e "CREATE USER IF NOT EXISTS 'krayineu_user'@'localhost' IDENTIFIED BY 'R3g3n3ri&';" && mysql -u root -e "GRANT ALL PRIVILEGES ON krayin_db.* TO 'krayineu_user'@'localhost';" && mysql -u root -e "FLUSH PRIVILEGES;"''',
    # Ajusta la configuración de Redis para escuchar en 0.0.0.0
    'echo "bind 0.0.0.0" >> /etc/redis/redis.conf',
    'chmod 644 /etc/redis/redis.conf',
    # Instala dependencias de Composer
    'composer install --no-dev --optimize-autoloader'
]

[phases.build]
dependsOn = ['install']
cmds = [
    # Instala dependencias de npm y construye los assets
    'npm install',
    'npm run build',  # Asegúrate de que este comando sea válido en package.json
    # Ejecuta la instalación de Krayin CRM, asegurando conexiones a MySQL/Redis
    'php artisan krayin-crm:install --force'  # Añade --force para evitar confirmaciones interactivas
]

[start]
cmd = 'mysqld --user=mysql --datadir=/var/lib/mysql & sleep 5 && redis-server --port 6379 --protected-mode no --dir /var/lib/redis & sleep 5 && php artisan serve --host=0.0.0.0 --port=8090'
