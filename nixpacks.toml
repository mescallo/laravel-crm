[phases.setup]
nixPkgs = [
    'php82',
    'php82Packages.composer',
    'nodejs',
    'git',
    'curl',
    'libpng'
]
nixLibs = ['libmysqlclient']
nixOverlays = ['https://github.com/railwayapp/nix-npm-overlay/archive/main.tar.gz']
nixpkgsArchive = 'dbc4f15b899ac77a8d408d8e0f89fa9c0c5f2b78'

[phases.install]
dependsOn = ['setup']
cmds = [
    'sudo apt-get update',
    'sudo apt-get install -y default-libmysqlclient-dev php8.1-fpm php8.1-mysql php8.1-gd php8.1-redis php8.1-curl php8.1-xml php8.1-zip php8.1-mbstring php8.1-bcmath php8.1-intl',
    'composer install --no-dev --optimize-autoloader'
]

[phases.build]
dependsOn = ['install']
cmds = [
    'npm install',
    'npm run build',
    # Ajustar el archivo .env para usar variables de entorno
    'sed -i "s/DB_HOST=127.0.0.1/DB_HOST=${DB_HOST:-database}/g" .env',
    'sed -i "s/REDIS_HOST=127.0.0.1/REDIS_HOST=${REDIS_HOST:-redis}/g" .env',
    'php artisan key:generate --force',
    'php artisan config:cache',
    'php artisan route:cache',
    'php artisan view:cache'
]

[start]
cmd = 'php artisan serve --host=0.0.0.0 --port=${PORT:-8090}'
