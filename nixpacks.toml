[phases.setup]
nixPkgs = [
    'php82',
    'php82Packages.composer',
    'nodejs',
    'git',
    'curl',
    'libpng',
    'mariadb',
    'redis'
]
nixLibs = ['libmysqlclient']
nixOverlays = ['https://github.com/railwayapp/nix-npm-overlay/archive/main.tar.gz']
nixpkgsArchive = 'dbc4f15b899ac77a8d408d8e0f89fa9c0c5f2b78'

[phases.install]
dependsOn = ['setup']
cmds = [
    'sudo apt-get update',
    'sudo apt-get install -y default-libmysqlclient-dev php8.1-fpm php8.1-mysql php8.1-gd php8.1-redis php8.1-curl php8.1-xml php8.1-zip php8.1-mbstring',
    'mkdir -p /var/lib/mysql /run/mysqld',
    'chown -R mysql:mysql /var/lib/mysql /run/mysqld',
    'mysql_install_db --user=mysql --datadir=/var/lib/mysql',
    'mysqld_safe --datadir=/var/lib/mysql &',
    'sleep 10',
    'mkdir -p /var/lib/redis',
    'redis-server --daemonize yes',
    'sleep 5',
    'mysql -u root -e "CREATE DATABASE IF NOT EXISTS krayin_db;"',
    'mysql -u root -e "CREATE USER IF NOT EXISTS krayineu_user@localhost IDENTIFIED BY \"R3g3n3ri&\";"',
    'mysql -u root -e "GRANT ALL PRIVILEGES ON krayin_db.* TO krayineu_user@localhost;"',
    'mysql -u root -e "FLUSH PRIVILEGES;"',
    'composer install --no-dev --optimize-autoloader'
]

[phases.build]
dependsOn = ['install']
cmds = [
    'npm install',
    'npm run build',
    'php artisan key:generate --force',
    'php artisan migrate --force',
    'php artisan config:cache',
    'php artisan route:cache'
]

[start]
cmd = 'mysqld_safe --datadir=/var/lib/mysql & redis-server --daemonize yes & sleep 5 && php artisan serve --host=0.0.0.0 --port=${PORT:-8090}'
